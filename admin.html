<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NOOR | ORDER ADMIN</title><style>body{font-family:Arial,"Yu Gothic",sans-serif;background:#090909;color:#eee;margin:0;padding:28px;line-height:1.7}main{max-width:1050px;margin:auto}h1{letter-spacing:.2em}input,button{padding:12px;font:inherit}input{background:#222;border:1px solid #777;color:white;max-width:100%;width:330px}button{background:#eee;border:0;cursor:pointer}article{border:1px solid #444;margin:14px 0;padding:18px}small{color:#aaa}.paid{color:#a9d6ac}.pending{color:#dcb77d}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}a{color:#eee}</style></head><body><main><h1>NOOR / ORDERS</h1><p>管理者専用・注文と発送状況</p><div class="bar"><input id="pw" type="password" autocomplete="off" placeholder="管理者パスワード"><button id="load">注文を表示</button><button id="clear">ログアウト</button></div><p id="msg" role="status">パスワードを入力してください。パスワードはブラウザーに保存しません。</p><div id="orders"></div><p><small>購入者の住所・メールはStripe管理画面で確認してください。管理画面のURL自体は秘密ではなく、パスワードで保護されています。</small></p></main><script>const api=location.origin;const pw=document.getElementById('pw'),msg=document.getElementById('msg'),root=document.getElementById('orders');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){root.replaceChildren();msg.textContent='注文を取得中…';try{const r=await fetch(api+'/api/admin/orders',{headers:{'X-Admin-Password':pw.value},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'読み込みに失敗しました');msg.textContent='注文 '+d.orders.length+' 件（最新200件まで）';for(const o of d.orders){const a=document.createElement('article');const paid=o.status==='paid';a.innerHTML='<div><strong>'+esc(o.items.map(i=>i.code+' × '+i.quantity).join('、'))+'</strong></div><div>注文日時：'+esc(new Date(o.createdAt).toLocaleString('ja-JP'))+'</div><div>決済：<span class="'+(paid?'paid':'pending')+'">'+esc(o.status)+'</span></div><div>発送：'+(o.shippedAt?'発送済み':'未発送')+'</div>';if(paid){const b=document.createElement('button');b.textContent=o.shippedAt?'未発送に戻す':'発送済みにする';b.onclick=async()=>{if(!confirm('発送状況を変更しますか？'))return;try{const r=await fetch(api+'/api/admin/shipments',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':pw.value},body:JSON.stringify({orderId:o.id,shipped:!o.shippedAt})});if(!r.ok)throw Error('更新に失敗しました');await load()}catch(e){msg.textContent=e.message}};a.appendChild(b)}root.appendChild(a)}}catch(e){msg.textContent=e.message}}document.getElementById('load').onclick=load;document.getElementById('clear').onclick=()=>{pw.value='';root.replaceChildren();msg.textContent='ログアウトしました'};</script></body></html>
